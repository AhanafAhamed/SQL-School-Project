{% extends "base.html" %}
{% block title %}Members - Library Management System{% endblock %}
{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2>Members</h2>
        <a href="/members/add" class="btn">+ Add New Member</a>
    </div>

    <form method="GET" style="margin-bottom: 1rem; display: flex; gap: 0.5rem;">
        <input type="text" name="search" placeholder="Search by name or email..."
            value="{{ request.args.get('search', '') }}"
            style="flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg);">
        <button type="submit" class="btn btn-secondary" style="background: #6c757d;">Search</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for member in members %}
            <tr>
                <td>{{ member.member_name }}</td>
                <td>{{ member.email }}</td>
                <td>{{ member.phone }}</td>
                <td>
                    <div class="actions-cell">
                        <a href="/members/edit/{{ member.member_id }}"
                            style="color: var(--accent); text-decoration: none; font-size: 0.9rem;">Edit</a>
                        <a href="/members/{{ member.member_id }}/history"
                            style="color: var(--accent); text-decoration: none; font-size: 0.9rem;">History</a>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
