{% extends "base.html" %}
{% block title %}Edit Loan - Library Management System{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Edit Loan</h2>
    <form method="POST">
        <div style="margin-bottom: 1rem;">
            <label style="display: block;">Book</label>
            <select name="book_id" required
                style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg);">
                {% for book in books %}
                <option value="{{ book.book_id }}" {{ 'selected' if loan.book_id==book.book_id else '' }}>{{ book.title
                    }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="margin-bottom: 1rem;">
            <label style="display: block;">Member</label>
            <select name="member_id" required
                style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg);">
                {% for member in members %}
                <option value="{{ member.member_id }}" {{ 'selected' if loan.member_id==member.member_id else '' }}>{{
                    member.member_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div>
                <label style="display: block;">Loan Date</label>
                <input type="date" name="loan_date" value="{{ loan.loan_date }}" required
                    style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg);">
            </div>
            <div>
                <label style="display: block;">Due Date</label>
                <input type="date" name="due_date" value="{{ loan.due_date }}" required
                    style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg);">
            </div>
        </div>
        <div style="margin-bottom: 1rem;">
            <label style="display: block;">Return Date (Actual)</label>
            <input type="date" name="return_date" value="{{ loan.return_date if loan.return_date else '' }}"
                style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg);">
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn" style="flex: 1;">Update Loan</button>
            <a href="/loans" class="btn"
                style="background: #6c757d; text-align: center; text-decoration: none; flex: 1;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
